#
# Every option, with several values and includes.
#
[options]
RootDir = /usr/
DBPath = /usr/lib/../lib
CacheDir = /var/cache/pacman/pkg/ /var/cache/pacman/extra
CacheDir = /srv/pkgcache/
HookDir = /etc/pacman.d/hooks/
HookDir = /usr/share/hooks
GPGDir = /usr/share/../bin
LogFile = /var/log/fixture.log
HoldPkg = pacman glibc
HoldPkg = linux*
IgnorePkg = firefox lib32-*
IgnorePkg = [gh]cc
IgnoreGroup = gnome kde-*
NoUpgrade = etc/passwd etc/fstab
NoUpgrade = !etc/exceptions
NoExtract = usr/share/doc/* usr/share/man/*
Architecture = auto x86_64_v3
XferCommand = /usr/bin/curl -L -C - -f -o %o %u
CleanMethod = KeepInstalled KeepCurrent
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
RemoteFileSigLevel = Required TrustAll
ParallelDownloads = 5
DownloadUser = alpm
DisableSandbox
CheckSpace
VerbosePkgLists
Color
ILoveCandy
NoProgressBar
UseSyslog
DisableDownloadTimeout
Include = conf.d/*.conf

[core]
Server = https://direct.example/$repo/os/$arch/
Include = mirrors/mirrorlist
SigLevel = Required

[extra]
Include = mirrors/*.list
Usage = Sync Search
SigLevel = Optional TrustAll

[multilib]
Server = https://multilib.example/$repo/os/$arch
CacheServer = https://cache1.example/$repo/os/$arch
CacheServer = https://cache2.example/$repo/os/$arch/
Usage = Install Upgrade
SigLevel = PackageTrustAll DatabaseNever
