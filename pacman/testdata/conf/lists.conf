# Option values: lists split at spaces only, single values keep the whole
# rest of the line, the last of a single value wins.
[options]
CacheDir = /a b
CacheDir = /c
HookDir = /h1 /h2
HoldPkg = a   b
IgnoreGroup = g1   g2
NoUpgrade = x y
XferCommand = first command
XferCommand = second   command   %u
LogFile = /l1
LogFile = /l2
ParallelDownloads = 2
ParallelDownloads = 3
CleanMethod = KeepCurrent
CleanMethod = KeepInstalled
DownloadUser = a
DownloadUser = b
Architecture = x86_64 auto
Architecture = x86_64_v3
Color
Color

[core]
Server = https://a.example/$repo with spaces
CacheServer = c d
Usage = Sync
Usage = Search
