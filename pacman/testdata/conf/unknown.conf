# Directives pacman does not know are warned about and ignored.
[options]
Bogus = 1
NoPassiveFtp
TotalDownload
UseDelta = 0.7
SyncFirst = a b
Color = yes
CheckSpace # trailing comment
ParallelDownloads
Server = https://options.example/outside-repo
HoldPkg = kept

[core]
Server = https://mirror.example/$repo
Color
Foo = bar
not a key value line
HoldPkg = in-repo
