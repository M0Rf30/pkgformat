version: "2"

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - nilerr
    - errorlint
    - ineffassign
    - copyloopvar

    # Security
    - gosec

    # Code quality
    - misspell
    - nolintlint
    - durationcheck
    - usestdlibvars
    - unconvert

    # Style
    - asciicheck
    - revive

  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversion (uint/int casts common in RPM binary format)

    revive:
      rules:
        # var-naming is disabled: it flags the public API (RPM_*_TYPE,
        # CpioEntry, KeyId, ...), which cannot be renamed without a major version.
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: error-naming
        - name: error-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - errcheck
    generated: strict
    presets:
      - comments
      - std-error-handling
      - common-false-positives

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  go: "1.27"
